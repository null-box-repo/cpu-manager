<!-- CPU Tuner layout -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPU Tuner</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="toolbar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="5" y="5" width="14" height="14" rx="2"></rect>
      <rect x="9" y="9" width="6" height="6"></rect>
      <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"></path>
    </svg>
    <div>
      <h1>CPU Tuner</h1>
      <p>governor &amp; frequency control</p>
    </div>
  </div>
</header>

<main>
  <section class="banner" id="banner" hidden></section>

  <section class="page" id="page-cpu">
    <section class="panel">
      <div class="panel-head">
        <h2>CPU Clusters</h2>
        <span class="hint">cores sharing one clock; changing a control applies instantly</span>
      </div>
      <div class="grid" id="cores"></div>
    </section>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/js/app.js"></script>
</body>
</html>
